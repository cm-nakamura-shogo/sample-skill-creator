[project]
name = "profile-photo-processor"
version = "0.1.0"
description = "Profile photo processor: remove background, center face, normalize brightness"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.23.2",
    "opencv-python>=4.12.0.88",
    "pillow>=12.1.0",
    "rembg>=2.0.69",
]

[project.scripts]
profile-photo-processor = "process_profile_photo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
